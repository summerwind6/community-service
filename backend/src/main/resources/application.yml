server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: community-service-system

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import: optional:classpath:application-local.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      database: 0

  session:
    redis:
      namespace: spring:session
      flush-mode: on_save

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.community.entity.po
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

shiro:
  web:
    enabled: true
  loginUrl: /api/auth/login
  successUrl: /api/dashboard
  unauthorizedUrl: /api/auth/unauthorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  info:
    title: 社区便民服务申请与进度管理系统API
    description: 政企简化版 - 接口文档
    version: 1.0.0

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  upload-dir: ${UPLOAD_DIR:uploads}
  public:
    progress-ip-limit-per-minute: ${PUBLIC_PROGRESS_IP_LIMIT:10}
    apply-phone-limit-per-hour: ${PUBLIC_APPLY_PHONE_LIMIT:3}
    apply-ip-limit-per-hour: ${PUBLIC_APPLY_IP_LIMIT:20}
    upload-ip-limit-per-minute: ${PUBLIC_UPLOAD_IP_LIMIT:20}
    evaluation-ip-limit-per-minute: ${PUBLIC_EVALUATION_IP_LIMIT:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
