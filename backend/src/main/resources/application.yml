server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: none
  servlet:
    context-path: /api

spring:
  application:
    name: community-core

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import:
      - optional:classpath:application-local.yml
      - optional:nacos:community-core.yaml?refreshEnabled=true

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
    loadbalancer:
      cache:
        enabled: false
      retry:
        enabled: false

  task:
    scheduling:
      pool:
        size: 3

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      database: 0
      connect-timeout: 200ms
      timeout: 200ms

  session:
    redis:
      namespace: spring:session
      flush-mode: on_save

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      operation-timeout: 5s
      properties:
        "[request.timeout.ms]": 3000
        "[default.api.timeout.ms]": 5000
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[enable.idempotence]": true
        "[max.block.ms]": 2000
        "[request.timeout.ms]": 3000
        "[delivery.timeout.ms]": 5000
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        "[allow.auto.create.topics]": false
    listener:
      ack-mode: record

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.community.entity.po
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

shiro:
  web:
    enabled: true
  loginUrl: /api/auth/login
  successUrl: /api/dashboard
  unauthorizedUrl: /api/auth/unauthorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  info:
    title: 社区便民服务申请与进度管理系统API
    description: 政企简化版 - 接口文档
    version: 1.0.0

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  audit:
    outbox-enabled: ${AUDIT_OUTBOX_ENABLED:true}
    processing-enabled: ${AUDIT_PROCESSING_ENABLED:true}
  gateway:
    token: ${GATEWAY_TOKEN:}
  guide:
    token: ${GUIDE_SERVICE_TOKEN:}
  upload-dir: ${UPLOAD_DIR:uploads}
  public:
    progress-ip-limit-per-minute: ${PUBLIC_PROGRESS_IP_LIMIT:10}
    apply-phone-limit-per-hour: ${PUBLIC_APPLY_PHONE_LIMIT:3}
    apply-ip-limit-per-hour: ${PUBLIC_APPLY_IP_LIMIT:20}
    upload-ip-limit-per-minute: ${PUBLIC_UPLOAD_IP_LIMIT:20}
    evaluation-ip-limit-per-minute: ${PUBLIC_EVALUATION_IP_LIMIT:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
