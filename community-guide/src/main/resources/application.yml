server:
  port: ${SERVER_PORT:8082}
  forward-headers-strategy: none
  servlet:
    context-path: /api

spring:
  application:
    name: community-guide
  config:
    import: optional:nacos:community-guide.yaml?refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/community_service?serverTimezone=Asia/Shanghai}
    username: ${GUIDE_DB_USERNAME:community_guide}
    password: ${GUIDE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 200ms
      timeout: 200ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

app:
  guide:
    token: ${GUIDE_SERVICE_TOKEN}

logging:
  level:
    com.community.controller.GuideEndpoints: ${GUIDE_REQUEST_LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
